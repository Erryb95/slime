<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Ultimate FPS Demo Level - Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
            cursor: crosshair;
        }
        
        #gameHUD {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        
        .hud-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff41;
            border-radius: 5px;
            padding: 10px;
            color: #00ff41;
            font-size: 14px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }
        
        #health-panel {
            top: 20px;
            left: 20px;
        }
        
        #weapon-panel {
            bottom: 20px;
            right: 20px;
            text-align: right;
        }
        
        #score-panel {
            top: 20px;
            right: 20px;
            text-align: right;
        }
        
        #fps-panel {
            bottom: 20px;
            left: 20px;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: #00ff41;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.8);
        }
        
        #crosshair::before {
            width: 20px;
            height: 2px;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }
        
        #crosshair::after {
            width: 2px;
            height: 20px;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff41;
            font-size: 24px;
            text-align: center;
            z-index: 2000;
        }
        
        .loading-spinner {
            border: 4px solid rgba(0, 255, 65, 0.3);
            border-top: 4px solid #00ff41;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #instructions {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #00ff41;
            font-size: 12px;
            opacity: 0.8;
        }
        
        .key {
            background: rgba(0, 255, 65, 0.2);
            border: 1px solid #00ff41;
            padding: 2px 6px;
            border-radius: 3px;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-spinner"></div>
        <div>Loading Enhanced Ultimate FPS Demo...</div>
        <div style="font-size: 14px; margin-top: 10px;">
            Physics Engine • AI Enemies • Multiple Weapons • 240Hz Target
        </div>
    </div>
    
    <canvas id="renderCanvas"></canvas>
    
    <div id="gameHUD" style="display: none;">
        <div id="health-panel" class="hud-panel">
            <div>Health: <span id="playerHealth">100/100</span></div>
        </div>
        
        <div id="weapon-panel" class="hud-panel">
            <div>Weapon: <span id="weaponName">CombatPistol</span></div>
            <div>Ammo: <span id="ammoCount">15/15</span></div>
        </div>
        
        <div id="score-panel" class="hud-panel">
            <div>Score: <span id="playerScore">0</span></div>
            <div>Wave: <span id="currentWave">1</span></div>
            <div>Kills: <span id="enemiesKilled">0</span></div>
        </div>
        
        <div id="fps-panel" class="hud-panel">
            <div id="fps-counter">FPS: 0/240</div>
        </div>
        
        <div id="crosshair"></div>
    </div>
    
    <div id="instructions">
        <div><span class="key">WASD</span> Move • <span class="key">Mouse</span> Look • <span class="key">Click</span> Fire • <span class="key">R</span> Reload</div>
        <div><span class="key">Space</span> Jump • <span class="key">Shift</span> Dash • <span class="key">F</span> Bullet Time • <span class="key">1-6</span> Switch Weapons</div>
    </div>

    <script type="module">
        import { EnhancedUltimateFPSDemoLevel } from './src/levels/EnhancedUltimateFPSDemoLevel.js';
        
        console.log('🎮 Enhanced Ultimate FPS Demo Level - Loading...');
        
        async function initializeGame() {
            try {
                const canvas = document.getElementById('renderCanvas');
                const loading = document.getElementById('loading');
                const hud = document.getElementById('gameHUD');
                const instructions = document.getElementById('instructions');
                
                console.log('🏗️ Creating game instance...');
                const game = new EnhancedUltimateFPSDemoLevel(canvas);
                
                // Wait a moment for initialization
                setTimeout(() => {
                    loading.style.display = 'none';
                    hud.style.display = 'block';
                    instructions.style.display = 'block';
                    console.log('✅ Enhanced Ultimate FPS Demo Level loaded successfully!');
                    console.log('📊 Game features:');
                    console.log('   • Physics-based combat system');
                    console.log('   • AI enemies with patrol/chase/attack behaviors');
                    console.log('   • 6 weapon types (pistol, rifle, shotgun, sniper, knife, bat)');
                    console.log('   • Third-person camera (toggle with T)');
                    console.log('   • Wave-based survival gameplay');
                    console.log('   • Advanced movement (dash, bullet time)');
                    console.log('   • Target performance: 240 FPS');
                }, 2000);
                
                // Add resize handler
                window.addEventListener('resize', () => {
                    game.engine.resize();
                });
                
                // Add click handler for pointer lock
                canvas.addEventListener('click', () => {
                    canvas.requestPointerLock();
                });
                
                return game;
                
            } catch (error) {
                console.error('❌ Failed to initialize Enhanced Ultimate FPS Demo Level:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #ff4444;">
                        <div>Failed to load game</div>
                        <div style="font-size: 14px; margin-top: 10px;">${error.message}</div>
                    </div>
                `;
            }
        }
        
        // Initialize the game
        initializeGame();
        
        // Add keyboard shortcuts for testing
        document.addEventListener('keydown', (event) => {
            switch(event.code) {
                case 'KeyG':
                    console.log('🎮 Game stats requested...');
                    // You can add game stats display here
                    break;
                case 'KeyH':
                    const instructions = document.getElementById('instructions');
                    instructions.style.display = instructions.style.display === 'none' ? 'block' : 'none';
                    break;
            }
        });
        
    </script>
</body>
</html>
