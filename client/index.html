<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLIME - Competitive FPS</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #renderCanvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      #ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1000;
      }
      #fps {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #00ff00;
        font-size: 16px;
        font-weight: bold;
        pointer-events: auto;
        background: rgba(0,0,0,0.5);
        padding: 5px 10px;
        border-radius: 3px;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        margin: -10px 0 0 -10px;
        pointer-events: none;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: #ff0000;
      }
      #crosshair::before {
        top: 9px;
        left: 0;
        width: 20px;
        height: 2px;
      }
      #crosshair::after {
        top: 0;
        left: 9px;
        width: 2px;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="ui">
      <div id="fps">FPS: 0</div>
      <div id="crosshair"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
