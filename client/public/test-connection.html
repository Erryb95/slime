<!DOCTYPE html>
<html>
<head>
    <title>Colyseus Connection Test</title>
</head>
<body>
    <h1>Colyseus Connection Test</h1>
    <div id="status">Connecting...</div>
    <div id="log"></div>

    <script src="https://unpkg.com/colyseus.js@^0.15.0/dist/colyseus.js"></script>
    <script>
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        
        function addLog(message) {
            console.log(message);
            log.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + message + '</div>';
        }
        
        async function testConnection() {
            try {
                addLog('Creating Colyseus client...');
                const client = new Colyseus.Client('ws://localhost:2567');
                
                addLog('Attempting to join room...');
                const room = await client.joinOrCreate('game');
                
                addLog('Connected to room: ' + room.id);
                status.textContent = 'Connected!';
                status.style.color = 'green';
                
                // Send test message
                room.send('test', { message: 'Hello from test page!', timestamp: Date.now() });
                addLog('Test message sent');
                
                room.onMessage('*', (type, message) => {
                    addLog('Received message: ' + type + ' - ' + JSON.stringify(message));
                });
                
            } catch (error) {
                addLog('Error: ' + error.message);
                status.textContent = 'Failed to connect';
                status.style.color = 'red';
            }
        }
        
        testConnection();
    </script>
</body>
</html>
