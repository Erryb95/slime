<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SLIME FPS - Animation Loading Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        
        #renderCanvas {
            width: 100%;
            height: 400px;
            border: 1px solid #333;
            background: #000;
        }
        
        .controls {
            margin: 20px 0;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 5px;
        }
        
        .animation-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        
        button {
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .log {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 3px;
        }
        
        .status.loading {
            background: #ff9800;
            color: black;
        }
        
        .status.success {
            background: #4CAF50;
        }
        
        .status.error {
            background: #f44336;
        }
    </style>
</head>
<body>
    <h1>SLIME FPS - Animation Loading Test</h1>
    
    <div class="status" id="status">Initializing...</div>
    
    <canvas id="renderCanvas"></canvas>
    
    <div class="controls">
        <h3>Animation Controls</h3>
        <div class="animation-controls" id="animationControls">
            <!-- Animation buttons will be added here -->
        </div>
        
        <div style="margin: 10px 0;">
            <label>
                <input type="checkbox" id="loopAnimations" checked> Loop Animations
            </label>
        </div>
        
        <button onclick="reloadModel()">Reload Model</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div class="controls">
        <h3>Loading Log</h3>
        <div class="log" id="log"></div>
    </div>

    <script type="module">
        import { Engine, Scene, ArcRotateCamera, Vector3, HemisphericLight, Color3 } from './node_modules/@babylonjs/core/index.js';
        import { PlayerManager } from './src/player/PlayerManager.js';
        import { EnhancedAssetManager } from './src/assets/EnhancedAssetManager.js';
        
        let engine, scene, camera, light, playerManager, assetManager;
        let currentModel = null;
        
        const logElement = document.getElementById('log');
        const statusElement = document.getElementById('status');
        const animationControlsElement = document.getElementById('animationControls');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const formattedMessage = `[${timestamp}] ${type.toUpperCase()}: ${message}`;
            logElement.textContent += formattedMessage + '\\n';
            logElement.scrollTop = logElement.scrollHeight;
            
            console.log(formattedMessage);
            
            // Update status
            if (type === 'error') {
                statusElement.textContent = message;
                statusElement.className = 'status error';
            } else if (type === 'success') {
                statusElement.textContent = message;
                statusElement.className = 'status success';
            } else if (type === 'loading') {
                statusElement.textContent = message;
                statusElement.className = 'status loading';
            }
        }
        
        function clearLogs() {
            logElement.textContent = '';
        }
        
        async function initBabylon() {
            try {
                log('Initializing Babylon.js...', 'loading');
                
                const canvas = document.getElementById('renderCanvas');
                engine = new Engine(canvas, true);
                scene = new Scene(engine);
                scene.clearColor = new Color3(0.2, 0.2, 0.3);
                
                // Setup camera
                camera = new ArcRotateCamera('camera', -Math.PI / 2, Math.PI / 3, 5, Vector3.Zero(), scene);
                camera.attachControls(canvas, true);
                
                // Setup lighting
                light = new HemisphericLight('light', new Vector3(0, 1, 0), scene);
                light.intensity = 0.7;
                
                // Initialize asset manager
                assetManager = new EnhancedAssetManager(scene);
                
                // Initialize player manager
                playerManager = new PlayerManager(scene);
                
                // Start render loop
                engine.runRenderLoop(() => {
                    scene.render();
                });
                
                // Handle resize
                window.addEventListener('resize', () => {
                    engine.resize();
                });
                
                log('Babylon.js initialized successfully', 'success');
                
                // Load the yBot model
                await loadModel();
                
            } catch (error) {
                log(`Failed to initialize Babylon.js: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        async function loadModel() {
            try {
                log('Loading yBot model...', 'loading');
                
                // Load the character using the PlayerManager
                await playerManager.loadCharacter('yBot');
                
                log('yBot model loaded successfully', 'success');
                
                // Get available animations and create controls
                createAnimationControls();
                
            } catch (error) {
                log(`Failed to load model: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        function createAnimationControls() {
            animationControlsElement.innerHTML = '';
            
            if (playerManager && playerManager.animations) {
                const animationNames = Array.from(playerManager.animations.keys());
                log(`Found ${animationNames.length} animations: ${animationNames.join(', ')}`, 'info');
                
                animationNames.forEach(animName => {
                    const button = document.createElement('button');
                    button.textContent = animName;
                    button.onclick = () => playAnimation(animName);
                    animationControlsElement.appendChild(button);
                });
                
                // Add stop button
                const stopButton = document.createElement('button');
                stopButton.textContent = 'Stop All';
                stopButton.style.background = '#f44336';
                stopButton.onclick = () => stopAllAnimations();
                animationControlsElement.appendChild(stopButton);
                
            } else {
                log('No animations found', 'info');
            }
        }
        
        function playAnimation(animName) {
            try {
                log(`Playing animation: ${animName}`, 'info');
                const loop = document.getElementById('loopAnimations').checked;
                playerManager.playAnimation(animName, loop);
            } catch (error) {
                log(`Failed to play animation ${animName}: ${error.message}`, 'error');
            }
        }
        
        function stopAllAnimations() {
            try {
                log('Stopping all animations', 'info');
                playerManager.stopAnimation();
            } catch (error) {
                log(`Failed to stop animations: ${error.message}`, 'error');
            }
        }
        
        window.reloadModel = async function() {
            try {
                log('Reloading model...', 'loading');
                
                // Dispose current model
                if (playerManager) {
                    playerManager.dispose();
                }
                
                // Reinitialize player manager
                playerManager = new PlayerManager(scene);
                
                // Reload model
                await loadModel();
                
            } catch (error) {
                log(`Failed to reload model: ${error.message}`, 'error');
            }
        };
        
        window.clearLogs = clearLogs;
        
        // Override console.log to capture PlayerManager logs
        const originalConsoleLog = console.log;
        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
            
            const message = args.join(' ');
            if (message.includes('Animation') || message.includes('Loading') || message.includes('Skeleton')) {
                log(message, 'info');
            }
        };
        
        // Initialize when page loads
        initBabylon();
    </script>
</body>
</html>
