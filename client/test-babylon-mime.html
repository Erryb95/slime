<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLIME FPS - Babylon MIME Type Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0,0,0,0.3);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00ff88;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            border-left: 4px solid #00ff88;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
        }
        .success { background: rgba(0,255,0,0.2); color: #00ff88; }
        .error { background: rgba(255,0,0,0.2); color: #ff6b6b; }
        .info { background: rgba(0,123,255,0.2); color: #4dabf7; }
        .loading { background: rgba(255,193,7,0.2); color: #ffd43b; }
        
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .file-test {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 SLIME FPS - Babylon File MIME Type Test</h1>
        
        <div class="test-section">
            <h2>Testing Babylon File Loading</h2>
            <div id="test-results"></div>
        </div>
        
        <div class="test-section">
            <h2>File Type Tests</h2>
            <div id="file-tests"></div>
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const resultsDiv = document.getElementById('test-results');
            const logEntry = document.createElement('div');
            logEntry.className = `test-result ${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            resultsDiv.appendChild(logEntry);
            console.log(message);
        }

        function testFile(filePath, expectedType) {
            return new Promise((resolve) => {
                const fileTestDiv = document.getElementById('file-tests');
                const testDiv = document.createElement('div');
                testDiv.className = 'file-test';
                testDiv.innerHTML = `
                    <strong>${filePath}</strong>
                    <span class="status loading">Testing...</span>
                `;
                fileTestDiv.appendChild(testDiv);

                fetch(filePath)
                    .then(response => {
                        const contentType = response.headers.get('content-type');
                        const isCorrect = contentType && contentType.includes(expectedType);
                        
                        testDiv.innerHTML = `
                            <strong>${filePath}</strong><br>
                            Expected: ${expectedType}<br>
                            Actual: ${contentType || 'undefined'}<br>
                            <span class="status ${isCorrect ? 'success' : 'error'}">
                                ${isCorrect ? '✅ PASS' : '❌ FAIL'}
                            </span>
                        `;

                        log(`${filePath}: ${contentType} - ${isCorrect ? 'PASS' : 'FAIL'}`, isCorrect ? 'success' : 'error');
                        resolve(isCorrect);
                    })
                    .catch(error => {
                        testDiv.innerHTML = `
                            <strong>${filePath}</strong><br>
                            <span class="status error">❌ ERROR: ${error.message}</span>
                        `;
                        log(`${filePath}: ERROR - ${error.message}`, 'error');
                        resolve(false);
                    });
            });
        }

        async function runTests() {
            log('🧪 Starting Babylon file MIME type tests...');
            
            const babylonFiles = [
                '/assets/models/yBot.babylon',
                '/assets/models/ak47.babylon',
                '/assets/maps/training.babylon'
            ];

            let passCount = 0;
            let totalCount = babylonFiles.length;

            for (const file of babylonFiles) {
                const passed = await testFile(file, 'application/json');
                if (passed) passCount++;
                await new Promise(resolve => setTimeout(resolve, 100)); // Small delay between tests
            }

            log('');
            log(`📊 Test Results: ${passCount}/${totalCount} tests passed`, passCount === totalCount ? 'success' : 'error');
            
            if (passCount === totalCount) {
                log('🎉 All Babylon files are being served with correct MIME type!', 'success');
                log('✅ XML parsing errors should be resolved', 'success');
            } else {
                log('⚠️ Some files are not being served as JSON', 'error');
                log('💡 This may cause XML parsing errors in the game', 'info');
            }
        }

        // Start tests when page loads
        window.addEventListener('load', () => {
            setTimeout(runTests, 500);
        });
    </script>
</body>
</html>
