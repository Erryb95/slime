<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLIME FPS - Final Integration Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            color: #ffffff;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #00ff41;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00ff41;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .test-card {
            background: rgba(20, 20, 30, 0.95);
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #333;
        }
        .test-card.pass { border-color: #00ff41; }
        .test-card.fail { border-color: #ff4444; }
        .test-card.running { border-color: #ffaa00; }
        .test-card h3 {
            color: #00ff41;
            margin: 0 0 15px 0;
        }
        .test-result {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-weight: bold;
        }
        .test-result.pass { background: rgba(0, 255, 65, 0.2); color: #00ff41; }
        .test-result.fail { background: rgba(255, 68, 68, 0.2); color: #ff4444; }
        .test-result.running { background: rgba(255, 170, 0, 0.2); color: #ffaa00; }
        .run-all-btn {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            font-size: 16px;
        }
        .run-all-btn:hover { background: #00cc33; }
        .summary {
            background: rgba(20, 20, 30, 0.95);
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #333;
            margin-top: 30px;
            text-align: center;
        }
        .log {
            background: #000;
            padding: 15px;
            border-radius: 4px;
            height: 150px;
            overflow-y: auto;
            font-size: 12px;
            border: 1px solid #333;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 SLIME FPS - Final Integration Test</h1>
        
        <button class="run-all-btn" onclick="runAllTests()">🧪 Run All Tests</button>
        
        <div class="test-grid">
            <div class="test-card" id="clientCard">
                <h3>Client Server Test</h3>
                <div id="clientResult" class="test-result running">Ready to test...</div>
                <div class="log" id="clientLog"></div>
            </div>
            
            <div class="test-card" id="serverCard">
                <h3>Game Server Test</h3>
                <div id="serverResult" class="test-result running">Ready to test...</div>
                <div class="log" id="serverLog"></div>
            </div>
            
            <div class="test-card" id="multiplayerCard">
                <h3>Multiplayer Connection Test</h3>
                <div id="multiplayerResult" class="test-result running">Ready to test...</div>
                <div class="log" id="multiplayerLog"></div>
            </div>
            
            <div class="test-card" id="assetsCard">
                <h3>Asset Loading Test</h3>
                <div id="assetsResult" class="test-result running">Ready to test...</div>
                <div class="log" id="assetsLog"></div>
            </div>
        </div>
        
        <div class="summary" id="summary">
            <h3>Test Summary</h3>
            <div id="summaryText">Click "Run All Tests" to begin testing...</div>
        </div>
    </div>

    <script src="https://unpkg.com/colyseus.js@0.15.24/dist/colyseus.js"></script>
    <script>
        function log(testName, message, type = 'info') {
            const logDiv = document.getElementById(testName + 'Log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff4444' : 
                         type === 'success' ? '#00ff41' : '#ffffff';
            logDiv.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateTestResult(testName, message, status) {
            const card = document.getElementById(testName + 'Card');
            const result = document.getElementById(testName + 'Result');
            
            card.className = `test-card ${status}`;
            result.className = `test-result ${status}`;
            result.textContent = message;
        }

        async function testClientServer() {
            log('client', 'Testing client server connection...');
            updateTestResult('client', 'Testing...', 'running');
            
            try {
                const response = await fetch('http://localhost:3001/', { 
                    method: 'HEAD',
                    timeout: 5000 
                });
                
                if (response.ok) {
                    log('client', '✅ Client server is accessible', 'success');
                    updateTestResult('client', '✅ Client Server Online', 'pass');
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                log('client', `❌ Client server test failed: ${error.message}`, 'error');
                updateTestResult('client', '❌ Client Server Failed', 'fail');
                return false;
            }
        }

        async function testGameServer() {
            log('server', 'Testing game server health endpoint...');
            updateTestResult('server', 'Testing...', 'running');
            
            try {
                const response = await fetch('http://localhost:2567/health');
                const data = await response.json();
                
                log('server', `✅ Server health check passed: ${JSON.stringify(data)}`, 'success');
                updateTestResult('server', `✅ Server Online (${Math.floor(data.uptime)}s)`, 'pass');
                return true;
            } catch (error) {
                log('server', `❌ Server health test failed: ${error.message}`, 'error');
                updateTestResult('server', '❌ Server Health Failed', 'fail');
                return false;
            }
        }

        async function testMultiplayerConnection() {
            log('multiplayer', 'Testing Colyseus multiplayer connection...');
            updateTestResult('multiplayer', 'Testing...', 'running');
            
            try {
                // Check if Colyseus is loaded
                if (typeof Colyseus === 'undefined') {
                    throw new Error('Colyseus library not loaded');
                }

                log('multiplayer', 'Creating Colyseus client...');
                const client = new Colyseus.Client('ws://localhost:2567');
                
                log('multiplayer', 'Attempting to join room "game"...');
                const room = await client.joinOrCreate('game', {
                    playerName: 'IntegrationTest',
                    testConnection: true
                });
                
                log('multiplayer', `✅ Connected to room: ${room.id}`, 'success');
                
                // Set up a promise to wait for welcome message
                const welcomePromise = new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        reject(new Error('Welcome message timeout'));
                    }, 5000);
                    
                    room.onMessage('welcome', (message) => {
                        clearTimeout(timeout);
                        log('multiplayer', `📩 Received welcome: ${JSON.stringify(message)}`, 'success');
                        resolve(message);
                    });
                });
                
                // Send test message
                room.send('test', { message: 'Integration test message', timestamp: Date.now() });
                log('multiplayer', '📤 Sent test message to server');
                
                // Wait for welcome message
                await welcomePromise;
                
                // Clean up
                room.leave();
                log('multiplayer', '🔌 Disconnected from room');
                
                updateTestResult('multiplayer', '✅ Multiplayer Working', 'pass');
                return true;
                
            } catch (error) {
                log('multiplayer', `❌ Multiplayer test failed: ${error.message}`, 'error');
                updateTestResult('multiplayer', '❌ Multiplayer Failed', 'fail');
                return false;
            }
        }

        async function testAssetLoading() {
            log('assets', 'Testing asset loading endpoints...');
            updateTestResult('assets', 'Testing...', 'running');
            
            try {
                // Test if asset files are accessible
                const testAssets = [
                    '/public/assets/manifest.json',
                    '/public/assets/maps/firstLevel.babylon',
                    '/level-explorer-new.html'
                ];
                
                let passedTests = 0;
                
                for (const asset of testAssets) {
                    try {
                        const response = await fetch(`http://localhost:3001${asset}`, { method: 'HEAD' });
                        if (response.ok) {
                            log('assets', `✅ Asset accessible: ${asset}`, 'success');
                            passedTests++;
                        } else {
                            log('assets', `⚠️ Asset not found: ${asset}`, 'error');
                        }
                    } catch (error) {
                        log('assets', `❌ Asset test failed: ${asset} - ${error.message}`, 'error');
                    }
                }
                
                if (passedTests >= 1) {
                    updateTestResult('assets', `✅ Assets Available (${passedTests}/${testAssets.length})`, 'pass');
                    return true;
                } else {
                    updateTestResult('assets', '❌ No Assets Found', 'fail');
                    return false;
                }
                
            } catch (error) {
                log('assets', `❌ Asset loading test failed: ${error.message}`, 'error');
                updateTestResult('assets', '❌ Asset Test Failed', 'fail');
                return false;
            }
        }

        async function runAllTests() {
            console.log('🧪 Starting SLIME FPS integration tests...');
            
            const summaryDiv = document.getElementById('summaryText');
            summaryDiv.textContent = 'Running tests...';
            
            // Run all tests
            const results = await Promise.all([
                testClientServer(),
                testGameServer(),
                testMultiplayerConnection(),
                testAssetLoading()
            ]);
            
            // Calculate summary
            const passed = results.filter(r => r).length;
            const total = results.length;
            
            const summaryCard = document.getElementById('summary');
            if (passed === total) {
                summaryCard.style.borderColor = '#00ff41';
                summaryDiv.innerHTML = `
                    <div style="color: #00ff41; font-size: 24px; margin-bottom: 10px;">🎉 ALL TESTS PASSED!</div>
                    <div>SLIME FPS is fully operational and ready for competitive gaming!</div>
                    <div style="margin-top: 15px;">
                        <a href="http://localhost:3001/" style="color: #00ff41;">🎮 Launch Main Game</a> | 
                        <a href="http://localhost:3001/level-explorer-new.html" style="color: #00ff41;">🗺️ Browse Maps</a>
                    </div>
                `;
            } else {
                summaryCard.style.borderColor = '#ff4444';
                summaryDiv.innerHTML = `
                    <div style="color: #ff4444; font-size: 24px; margin-bottom: 10px;">⚠️ TESTS FAILED</div>
                    <div>${passed}/${total} tests passed. Check logs above for details.</div>
                `;
            }
            
            console.log(`🏁 Tests completed: ${passed}/${total} passed`);
        }

        // Auto-run tests after a short delay
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 2000);
        });
    </script>
</body>
</html>
