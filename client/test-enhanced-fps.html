<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced FPS Demo - Runtime Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            width: 100%;
            height: 100vh;
            display: block;
        }
        .status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff00;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
            font-family: 'Courier New', monospace;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            text-align: center;
        }
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #00ff00;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #ff4444;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff4444;
        }
        .success {
            color: #44ff44;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #44ff44;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="loadingScreen" class="loading">
        <div class="spinner"></div>
        <div>Loading Enhanced Ultimate FPS Demo...</div>
        <div style="font-size: 14px; margin-top: 10px;">Testing Enhanced Version</div>
    </div>
    
    <div id="status" class="status">
        Status: Initializing...
    </div>

    <script type="module">
        import { EnhancedUltimateFPSDemoLevel } from '/src/levels/EnhancedUltimateFPSDemoLevel.ts';
        
        const canvas = document.getElementById('gameCanvas');
        const loadingScreen = document.getElementById('loadingScreen');
        const statusDiv = document.getElementById('status');
        
        function updateStatus(message, isError = false, isSuccess = false) {
            statusDiv.textContent = `Status: ${message}`;
            statusDiv.className = 'status';
            if (isError) statusDiv.className += ' error';
            if (isSuccess) statusDiv.className += ' success';
            console.log(`[Enhanced FPS Test] ${message}`);
        }
        
        async function testEnhancedFPSDemo() {
            try {
                updateStatus('Creating Enhanced FPS Demo Level...');
                
                // Initialize the Enhanced FPS Demo
                const game = new EnhancedUltimateFPSDemoLevel(canvas);
                
                updateStatus('Initializing game systems...');
                await game.initialize();
                
                updateStatus('Loading assets (primitive fallbacks)...');
                await game.loadAllAssets();
                
                updateStatus('Starting game loop...');
                game.startGameLoop();
                
                // Hide loading screen
                loadingScreen.style.display = 'none';
                
                updateStatus('Enhanced FPS Demo successfully loaded!', false, true);
                
                // Show game status every 5 seconds
                setInterval(() => {
                    const gameStatus = game.getGameStatus();
                    const statusText = `Assets: ${gameStatus.assetsLoaded}, Weapons: ${gameStatus.weaponsAvailable}, Enemies: ${gameStatus.enemiesActive}, FPS: ${gameStatus.fps}, Wave: ${gameStatus.currentWave}, Score: ${gameStatus.score}`;
                    updateStatus(statusText, false, true);
                }, 5000);
                
            } catch (error) {
                console.error('Enhanced FPS Demo initialization failed:', error);
                updateStatus(`Error: ${error.message}`, true);
                loadingScreen.innerHTML = `
                    <div style="color: #ff4444;">
                        <div>❌ Enhanced FPS Demo Failed to Load</div>
                        <div style="font-size: 14px; margin-top: 10px;">Error: ${error.message}</div>
                        <div style="font-size: 12px; margin-top: 10px;">Check console for details</div>
                    </div>
                `;
            }
        }
        
        // Start the test
        testEnhancedFPSDemo();
    </script>
</body>
</html>
