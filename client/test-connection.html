<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLIME FPS - Connection Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            color: #ffffff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(20, 20, 30, 0.95);
            padding: 30px;
            border-radius: 8px;
            border: 2px solid #00ff41;
        }
        h1 {
            color: #00ff41;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00ff41;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 6px;
            border: 1px solid #333;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-weight: bold;
        }
        .status.success { background: rgba(0, 255, 65, 0.2); border: 1px solid #00ff41; }
        .status.error { background: rgba(255, 68, 68, 0.2); border: 1px solid #ff4444; }
        .status.info { background: rgba(68, 136, 255, 0.2); border: 1px solid #4488ff; }
        button {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #00cc33; }
        .log {
            background: #000;
            padding: 15px;
            border-radius: 4px;
            height: 200px;
            overflow-y: auto;
            font-size: 12px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 SLIME FPS Connection Test</h1>
        
        <div class="test-section">
            <h3>Server Health Check</h3>
            <div id="healthStatus" class="status info">Click to test server health</div>
            <button onclick="testHealth()">Test Health Endpoint</button>
        </div>

        <div class="test-section">
            <h3>Multiplayer Connection Test</h3>
            <div id="connectionStatus" class="status info">Click to test multiplayer connection</div>
            <button onclick="testConnection()">Test Colyseus Connection</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>

        <div class="test-section">
            <h3>Connection Log</h3>
            <div id="log" class="log"></div>
            <button onclick="clearLog()">Clear Log</button>
        </div>
    </div>    <script src="https://unpkg.com/colyseus.js@0.15.24/dist/colyseus.js"></script>
    <script>
        let client = null;
        let room = null;

        // Wait for Colyseus to be loaded
        window.addEventListener('load', () => {
            console.log('Colyseus loaded:', typeof Colyseus);
            console.log('Colyseus properties:', Colyseus ? Object.keys(Colyseus) : 'undefined');
            setTimeout(() => {
                testHealth();
            }, 1000);
        });

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff4444' : 
                         type === 'success' ? '#00ff41' : '#ffffff';
            logDiv.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        async function testHealth() {
            const statusDiv = document.getElementById('healthStatus');
            statusDiv.textContent = 'Testing server health...';
            statusDiv.className = 'status info';
            
            try {
                log('Testing server health endpoint...');
                const response = await fetch('http://localhost:2567/health');
                const data = await response.json();
                
                statusDiv.textContent = `✅ Server is healthy! Uptime: ${Math.floor(data.uptime)}s`;
                statusDiv.className = 'status success';
                log(`✅ Health check passed: ${JSON.stringify(data)}`, 'success');
            } catch (error) {
                statusDiv.textContent = `❌ Server health check failed: ${error.message}`;
                statusDiv.className = 'status error';
                log(`❌ Health check failed: ${error.message}`, 'error');
            }
        }

        async function testConnection() {
            const statusDiv = document.getElementById('connectionStatus');
            statusDiv.textContent = 'Connecting to multiplayer server...';
            statusDiv.className = 'status info';
            
            try {
                log('Creating Colyseus client...');                // Check if Colyseus is properly loaded
                if (typeof Colyseus === 'undefined') {
                    throw new Error('Colyseus library not loaded');
                }
                log(`Colyseus available with: ${Object.keys(Colyseus).join(', ')}`);
                
                // Try different client constructors
                let clientConstructor = Colyseus.Client || Colyseus.default?.Client || Colyseus;
                if (typeof clientConstructor !== 'function') {
                    throw new Error(`No valid Colyseus client constructor found. Available: ${Object.keys(Colyseus)}`);
                }
                
                client = new clientConstructor('ws://localhost:2567');
                
                log('Attempting to join room "game"...');
                room = await client.joinOrCreate('game', {
                    playerName: 'TestPlayer',
                    testConnection: true
                });
                
                statusDiv.textContent = `✅ Connected to room: ${room.id}`;
                statusDiv.className = 'status success';
                log(`✅ Successfully connected to room: ${room.id}`, 'success');
                
                // Set up event handlers
                room.onMessage('*', (type, message) => {
                    log(`📩 Received message [${type}]: ${JSON.stringify(message)}`, 'success');
                });

                room.onStateChange((state) => {
                    log(`🔄 State changed: ${Object.keys(state).length} properties`);
                });

                room.onLeave(() => {
                    log('🔌 Disconnected from room');
                    statusDiv.textContent = '🔌 Disconnected from server';
                    statusDiv.className = 'status info';
                });

                // Send a test message
                room.send('test', { message: 'Hello from connection test!', timestamp: Date.now() });
                log('📤 Sent test message to server');
                
            } catch (error) {
                statusDiv.textContent = `❌ Connection failed: ${error.message}`;
                statusDiv.className = 'status error';
                log(`❌ Connection failed: ${error.message}`, 'error');
            }
        }

        function disconnect() {
            if (room) {
                room.leave();
                room = null;
                client = null;
                log('🔌 Manually disconnected from server');
            }
        }        // Auto-test health on page load
        // (Already handled in the window load event above)
    </script>
</body>
</html>
