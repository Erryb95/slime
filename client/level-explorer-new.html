<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLIME FPS - Level Explorer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e);
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #00ff41;
        }

        .header h1 {
            margin: 0;
            color: #00ff41;
            font-size: 28px;
            text-shadow: 0 0 10px #00ff41;
        }

        .header p {
            margin: 10px 0 0 0;
            color: #aaa;
            font-size: 14px;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .map-selector-container {
            background: rgba(20, 20, 30, 0.95);
            border-radius: 8px;
            border: 1px solid #333;
        }

        .info-panel {
            background: rgba(20, 20, 30, 0.95);
            border-radius: 8px;
            border: 1px solid #333;
            padding: 20px;
            height: fit-content;
        }

        .info-panel h3 {
            color: #00ff41;
            margin: 0 0 15px 0;
            font-size: 18px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #333;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #00ff41;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
        }

        .collection-stats {
            margin-top: 20px;
        }

        .collection-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }

        .collection-item:last-child {
            border-bottom: none;
        }

        .collection-name {
            color: #fff;
            font-size: 14px;
        }

        .collection-count {
            color: #00ff41;
            font-size: 12px;
            background: rgba(0, 255, 65, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .controls {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .control-btn {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .control-btn:hover {
            background: #00cc33;
            transform: scale(1.05);
        }

        .control-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid #666;
        }

        .control-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-content {
            background: rgba(20, 20, 30, 0.95);
            padding: 40px;
            border-radius: 8px;
            border: 2px solid #00ff41;
            text-align: center;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #00ff41;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .attribution {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
            font-size: 11px;
            color: #666;
            line-height: 1.4;
        }

        .error-message {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            border-radius: 4px;
            padding: 15px;
            margin: 20px;
            color: #ff4444;
        }

        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Remove the old map selector placeholder and info panel, and replace with a modern, minimal map selector and the demo level integration -->
    <div class="header">
        <h1>SLIME FPS - Level Explorer</h1>
        <p>Select a map and play the Enhanced Ultimate FPS Demo Level</p>
    </div>

    <div class="main-container">
        <div class="map-selector-container">
            <div id="mapSelectorContainer"></div>
        </div>
        <div class="info-panel">
            <h3>Demo Level</h3>
            <div id="gameContainer" style="width:100%;height:400px;min-height:300px;position:relative;background:#111;border-radius:8px;overflow:hidden;">
                <canvas id="renderCanvas" style="width:100%;height:100%;display:block;cursor:crosshair;"></canvas>
                <div id="gameHUD" style="display:none;"></div>
            </div>
            <div id="mapPreview" style="margin-top:20px;"></div>
            <div style="margin-top:20px;">
                <button class="control-btn" id="playSelectedMapBtn">Play Selected Map</button>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay" style="display:none;">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h3 style="color: #00ff41; margin: 0 0 10px 0;">Loading Demo Level</h3>
            <p id="loadingText">Initializing...</p>
        </div>
    </div>

    <!-- Import Babylon.js from CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script type="module">
        import { MapSelector } from './src/ui/MapSelector.js';
        import { EnhancedUltimateFPSDemoLevel } from './src/levels/levels/EnhancedUltimateFPSDemoLevel.js';
        import { EnhancedAssetManager } from './src/assets/EnhancedAssetManager.js';
        import { ASSET_CONFIG } from './src/assets/AssetLoadingConfig.js';

        let demoGame = null;
        let selectedMapId = null;
        let mapSelector = null;

        function showLoading(text) {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingText').textContent = text || 'Loading...';
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function launchDemoLevel(mapId) {
            showLoading('Launching Demo Level...');
            setTimeout(() => {
                if (demoGame) {
                    demoGame.engine.dispose();
                }
                const canvas = document.getElementById('renderCanvas');
                demoGame = new EnhancedUltimateFPSDemoLevel(canvas);
                // Optionally: pass mapId to demoGame if supported
                document.getElementById('gameHUD').style.display = 'block';
                hideLoading();
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Setup map selector
            mapSelector = new MapSelector('mapSelectorContainer', new EnhancedAssetManager(null));
            mapSelector.show();
            // Listen for map selection
            mapSelector.selectMap = (mapId, asset) => {
                selectedMapId = mapId;
                document.getElementById('mapPreview').innerHTML = `<b>Selected:</b> ${asset.displayName}`;
            };
            document.getElementById('playSelectedMapBtn').onclick = () => {
                if (selectedMapId) {
                    launchDemoLevel(selectedMapId);
                } else {
                    alert('Please select a map first!');
                }
            };
        });
    </script>
</body>
</html>
