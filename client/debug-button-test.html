<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Click Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }
        .test-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px;
        }
        .test-button:hover {
            background: #0056b3;
        }
        #log {
            background: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 4px;
            margin-top: 20px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Button Click Debug Test</h1>
    <p>Testing different ways to handle button clicks:</p>
    
    <button class="test-button" onclick="logMessage('Inline onclick works!')">
        Inline onclick
    </button>
    
    <button class="test-button" id="eventListener">
        Event Listener
    </button>
    
    <button class="test-button" id="windowFunction">
        Window Function
    </button>
    
    <div id="log"></div>
    
    <script>
        function logMessage(message) {
            const log = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            log.innerHTML += `[${timestamp}] ${message}\n`;
            log.scrollTop = log.scrollHeight;
            console.log(`[Debug] ${message}`);
        }
        
        // Test event listener
        document.getElementById('eventListener').addEventListener('click', () => {
            logMessage('Event listener works!');
        });
        
        // Test window function
        window.testWindowFunction = function() {
            logMessage('Window function works!');
        };
        
        document.getElementById('windowFunction').onclick = () => {
            window.testWindowFunction();
        };
        
        logMessage('Debug test page loaded');
    </script>
</body>
</html>
