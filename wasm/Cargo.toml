[package]
name = "corvo-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings around sparrow for the Corvo nesting demo"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sparrow = { path = "..", features = ["only_final_svg"] }
jagua-rs = { version = "0.8.3", features = ["spp"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
getrandom = { version = "0.4", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
log = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
