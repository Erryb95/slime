<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corvo</title>
<link rel="stylesheet" href="css/panel.css">
</head>
<body>
<main class="panel">
  <section class="fields">
    <label class="field"><span data-i18n="rollWidth">Roll width</span>
      <span class="unit"><input type="number" id="rollWidth" value="600" min="10" max="10000" step="10"><i>mm</i></span>
    </label>
    <label class="field"><span data-i18n="gap">Gap</span>
      <span class="unit"><input type="number" id="gap" value="2" min="0" max="100" step="0.5"><i>mm</i></span>
    </label>
    <label class="field"><span data-i18n="rotations">Rotations</span>
      <select id="rotations">
        <option value="none" data-i18n="rotNone">None</option>
        <option value="180">0 / 180°</option>
        <option value="90" selected>0 / 90 / 180 / 270°</option>
        <option value="free" data-i18n="rotFree">Free</option>
      </select>
    </label>
    <label class="field"><span data-i18n="time">Time</span>
      <span class="unit"><input type="number" id="time" value="30" min="2" max="3600" step="5"><i>s</i></span>
    </label>
    <!-- MODULO 8: preset rotolo DTF + immagini raster (contorno dalla trasparenza) -->
    <label class="field"><span data-i18n="preset">Preset</span>
      <select id="preset">
        <option value="" data-i18n="presetCustom">Custom</option>
        <option value="dtf22">DTF 22" · 558.8 mm</option>
        <option value="dtf58">DTF 58 cm · 580 mm</option>
      </select>
    </label>
    <label class="field"><span data-i18n="images">Images</span>
      <select id="rasterMode">
        <option value="contour" data-i18n="imgContour" selected>Contour</option>
        <option value="bbox" data-i18n="imgBbox">Bounding box</option>
      </select>
    </label>
  </section>

  <section class="actions">
    <button type="button" id="btnNest" class="btn primary" data-i18n="nest">Nest</button>
    <button type="button" id="btnStop" class="btn" data-i18n="stop" disabled>Stop</button>
    <button type="button" id="btnApply" class="btn" data-i18n="apply" disabled>Apply</button>
    <button type="button" id="btnCancel" class="btn" data-i18n="cancel" disabled>Cancel</button>
  </section>

  <section class="stats">
    <div class="stat"><span class="k" data-i18n="length">Length</span><span class="v" id="sLength">–</span></div>
    <div class="stat"><span class="k" data-i18n="fill">Fill</span><span class="v" id="sFill">–</span></div>
    <div class="stat"><span class="k" data-i18n="elapsed">Time</span><span class="v" id="sElapsed">–</span></div>
    <div class="stat"><span class="k" data-i18n="phase">Phase</span><span class="v" id="sPhase">–</span></div>
  </section>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="fillBar"><i id="fillBarFill"></i></div>
  <div class="bar thin" id="timeBar"><i id="timeBarFill"></i></div>

  <p class="status" id="status" data-i18n="ready">Select the pieces and press Nest.</p>

  <footer>
    <span class="brand">CORVO</span>
    <button type="button" id="btnLang" class="link" title="Language">EN</button>
  </footer>
</main>

<script src="js/CSInterface.js"></script>
<script src="lib/clipper.js"></script>
<script>
  // With Node enabled in CEP, clipper.js exports through module.exports instead of window.ClipperLib.
  if (!window.ClipperLib && typeof module !== 'undefined' && module.exports && module.exports.Clipper) {
    window.ClipperLib = module.exports;
  }
</script>
<script src="js/geometry.js"></script>
<script src="js/raster.js"></script><!-- MODULO 8 -->
<script src="js/main.js"></script>
</body>
</html>
