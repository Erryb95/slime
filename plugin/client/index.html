<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corvo</title>
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/report.css">
<link rel="stylesheet" href="css/license.css"><!-- MODULO 9 -->
<link rel="stylesheet" href="css/quantity.css"><!-- MODULO 3 -->
</head>
<body>
<main class="panel">
  <section class="fields">
    <label class="field"><span data-i18n="rollWidth">Roll width</span>
      <span class="unit"><input type="number" id="rollWidth" value="600" min="10" max="10000" step="10"><i>mm</i></span>
    </label>
    <label class="field"><span data-i18n="gap">Gap</span>
      <span class="unit"><input type="number" id="gap" value="2" min="0" max="100" step="0.5"><i>mm</i></span>
    </label>
    <label class="field"><span data-i18n="rotations">Rotations</span>
      <select id="rotations">
        <option value="none" data-i18n="rotNone">None</option>
        <option value="180">0 / 180°</option>
        <option value="90" selected>0 / 90 / 180 / 270°</option>
        <option value="free" data-i18n="rotFree">Free</option>
      </select>
    </label>
    <!-- MODULO 6: crocini di registro print&cut (opzioni riempite da js/regmarks.js) -->
    <label class="field"><span data-i18n="regmarks">Reg. marks</span>
      <select id="regmarks"><option value="none" data-i18n="rmNone">None</option></select>
    </label>
    <label class="field"><span data-i18n="time">Time</span>
      <span class="unit"><input type="number" id="time" value="30" min="2" max="3600" step="5"><i>s</i></span>
    </label>
    <label class="field wide"><span data-i18n="shapeSrc">Shape used for nesting</span>
      <select id="shapeSrc">
        <option value="all" data-i18n="shapeAll" selected>All artwork</option>
        <option value="cut" data-i18n="shapeCut">Cut line only (CutContour…)</option>
      </select>
    </label>
    <label class="check wide"><input type="checkbox" id="merge" checked><span data-i18n="merge">Merge overlapping objects</span></label>
    <!-- MODULO 2: pieces inside holes -->
    <label class="check wide" id="holesOpt"><input type="checkbox" id="useHoles" checked><span data-i18n="useHoles">Use holes</span></label>
    <!-- MODULO 8: preset rotolo DTF + immagini raster (contorno dalla trasparenza) -->
    <label class="field"><span data-i18n="preset">Preset</span>
      <select id="preset">
        <option value="" data-i18n="presetCustom">Custom</option>
        <option value="dtf22">DTF 22" · 558.8 mm</option>
        <option value="dtf58">DTF 58 cm · 580 mm</option>
      </select>
    </label>
    <label class="field"><span data-i18n="images">Images</span>
      <select id="rasterMode">
        <option value="contour" data-i18n="imgContour" selected>Contour</option>
        <option value="bbox" data-i18n="imgBbox">Bounding box</option>
      </select>
    </label>
  </section>

  <section class="actions">
    <button type="button" id="btnNest" class="btn primary" data-i18n="nest">Nest</button>
    <button type="button" id="btnStop" class="btn" data-i18n="stop" disabled>Stop</button>
    <button type="button" id="btnApply" class="btn" data-i18n="apply" disabled>Apply</button>
    <button type="button" id="btnCancel" class="btn" data-i18n="cancel" disabled>Cancel</button>
  </section>

  <section class="stats">
    <div class="stat"><span class="k" data-i18n="length">Length</span><span class="v" id="sLength">–</span></div>
    <div class="stat"><span class="k" data-i18n="fill">Fill</span><span class="v" id="sFill">–</span></div>
    <div class="stat"><span class="k" data-i18n="elapsed">Time</span><span class="v" id="sElapsed">–</span></div>
    <div class="stat"><span class="k" data-i18n="phase">Phase</span><span class="v" id="sPhase">–</span></div>
  </section>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="fillBar"><i id="fillBarFill"></i></div>
  <div class="bar thin" id="timeBar"><i id="timeBarFill"></i></div>

  <p class="status" id="status" data-i18n="ready">Select the pieces and press Nest.</p>

  <!-- MODULO 3: quantita' per pezzo, coppie specchiate, copie vicine (js/quantity.js + js/quantity-panel.js) -->
  <details class="m3" id="m3">
    <summary data-i18n="qtyTitle">Copies &amp; mirrored pairs</summary>
    <div class="m3-row">
      <button type="button" id="m3Load" class="btn mini" data-i18n="qtyLoad">Read selection</button>
      <span class="lbl" data-i18n="qtySetAll">All</span>
      <input type="number" id="m3All" value="1" min="1" max="999" step="1">
      <button type="button" id="m3SetAll" class="btn mini">OK</button>
    </div>
    <div class="m3-list">
      <table class="m3-table">
        <thead><tr><th data-i18n="qtyPiece">Piece</th><th data-i18n="qtyQty">Qty</th><th data-i18n="qtyMirror">L+R</th></tr></thead>
        <tbody id="m3Body"></tbody>
      </table>
    </div>
    <label class="check"><input type="checkbox" id="m3Close"><span data-i18n="qtyClose">Keep copies of the same design together</span></label>
    <p class="m3-sum" id="m3Sum"></p>
  </details>

  <!-- MODULO 5: report materiale e costo (js/report.js + js/report-panel.js, css/report.css) -->
  <details class="m5" id="m5">
    <summary data-m5="title">Material &amp; cost</summary>
    <section class="m5-fields">
      <label class="field wide"><span data-m5="preset">Material</span>
        <span class="m5-row">
          <select id="m5Preset"></select>
          <button type="button" id="m5Save" class="btn mini" data-m5="save">Save</button>
          <button type="button" id="m5Del" class="btn mini" data-m5="del">Delete</button>
        </span>
      </label>
      <label class="field wide"><span data-m5="name">Name</span><input type="text" id="m5Name" maxlength="60"></label>
      <label class="field"><span data-m5="price">Price</span>
        <span class="unit"><input type="number" id="m5Price" min="0" step="0.1" value="0"><i id="m5Cur">€</i></span>
      </label>
      <label class="field"><span data-m5="priceUnit">Per</span>
        <select id="m5Unit">
          <option value="m" data-m5="perM">linear metre</option>
          <option value="m2" data-m5="perM2">m²</option>
          <option value="sheet" data-m5="perSheet">sheet</option>
        </select>
      </label>
      <label class="field" id="m5SheetWrap" hidden><span data-m5="sheetLen">Sheet length</span>
        <span class="unit"><input type="number" id="m5Sheet" min="1" step="10" value="1000"><i>mm</i></span>
      </label>
      <label class="field"><span data-m5="allowance">Waste allowance</span>
        <span class="unit"><input type="number" id="m5Waste" min="0" max="100" step="1" value="0"><i>%</i></span>
      </label>
      <label class="field"><span data-m5="currency">Currency</span>
        <select id="m5Currency"><option value="EUR">EUR €</option><option value="USD">USD $</option></select>
      </label>
      <label class="field"><span data-m5="labor">Labour</span>
        <span class="unit"><input type="number" id="m5Labor" min="0" step="1" value="0"><i data-m5="perHour">/h</i></span>
      </label>
      <label class="field"><span data-m5="weed">Weeding</span>
        <span class="unit"><input type="number" id="m5Weed" min="0" step="1" value="0"><i>min/m²</i></span>
      </label>
      <label class="field"><span data-m5="jobs">Jobs / month</span>
        <input type="number" id="m5Jobs" min="0" step="1" value="0">
      </label>
      <label class="field wide"><span data-m5="job">Job / client</span><input type="text" id="m5Job" maxlength="80"></label>
    </section>
    <dl class="m5-out" id="m5Out"><dt data-m5="none">–</dt></dl>
    <p class="m5-save" id="m5Savings"></p>
    <section class="actions">
      <button type="button" id="m5Csv" class="btn" data-m5="csv" disabled>Export CSV</button>
      <button type="button" id="m5Copy" class="btn" data-m5="copy" disabled>Copy summary</button>
    </section>
    <p class="status" id="m5Status"></p>
  </details>

  <footer>
    <span class="brand">CORVO <span class="ver" id="corvoVersion">v0.9.0-beta</span></span><!-- MODULO 9: versione; il badge licenza lo aggiunge js/license.js -->
    <button type="button" id="btnLang" class="link" title="Language">EN</button>
  </footer>
</main>

<script src="js/CSInterface.js"></script>
<script src="lib/clipper.js"></script>
<script>
  // With Node enabled in CEP, clipper.js exports through module.exports instead of window.ClipperLib.
  if (!window.ClipperLib && typeof module !== 'undefined' && module.exports && module.exports.Clipper) {
    window.ClipperLib = module.exports;
  }
</script>
<script src="js/geometry.js"></script>
<script src="js/cluster.js"></script>
<script src="js/regmarks.js"></script><!-- MODULO 6 -->
<script src="js/holes.js"></script><!-- MODULO 2 -->
<script src="js/quantity.js"></script><!-- MODULO 3 -->
<script src="js/raster.js"></script><!-- MODULO 8 -->
<script src="js/license.js"></script><!-- MODULO 9: prima di main.js -->
<script src="js/main.js"></script>
<script src="js/report.js"></script>
<script src="js/report-panel.js"></script>
<script src="js/quantity-panel.js"></script><!-- MODULO 3 -->
</body>
</html>
